# Runs the full test suite on every push to main and every pull request.
# A throwaway Supabase runs inside the GitHub machine, so tests never touch the live database
# and no secrets are needed. Results show as a ✓ or ✗ next to each commit on GitHub.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button on GitHub

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start a throwaway Supabase (database, login, API) with our migrations
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Point the app at it
        run: |
          supabase status -o json | jq -r '"NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\(.PUBLISHABLE_KEY)"' >> "$GITHUB_ENV"

      - name: Build the site
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
